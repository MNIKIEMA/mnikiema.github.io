[project]
name = "mnikiema-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "connectorx>=0.4.5",
    "datasets>=3.6.0",
    "jupyter>=1.1.1",
    "lancedb>=0.22.0",
    "msgspec>=0.19.0",
    "optimum[onnxruntime]>=1.25.0",
    "polars>=1.39.0",
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=4.1.0",
    "transformers>=4.57",
    "trl[peft]>=0.19.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "rumdl>=0.3.4",
]

[tool.rumdl]
# Lint both plain Markdown and Quarto sources
include = ["**/*.md", "**/*.qmd"]
exclude = ["docs/**", "_freeze/**", "_extensions/**", ".quarto/**", ".venv/**"]
disable = [
    "MD013", # line length: prose paragraphs are written on one line
    "MD014", # `$ cmd` without output is fine in tutorials
    "MD033", # inline HTML is used on purpose in posts
    "MD041", # Quarto front matter supplies the title, no H1 needed
    "MD078", # Quarto chunk labels are not required
]

[tool.rumdl.per-file-flavor]
"**/*.qmd" = "quarto"
